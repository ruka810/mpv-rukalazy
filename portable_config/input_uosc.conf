 Ctrl+q            quit                                                  #! 退出mpv


### ====================== 不映射菜单 ======================

 POWER             quit                                                  # 退出
 PLAY              no-osd set pause no ; show-text "播放"                    # 暂停
 PAUSE             no-osd set pause yes ; show-text "暂停"                    # 播放
 PLAYPAUSE         no-osd cycle pause ; show-text "已切换 播放/暂停"              # 暂停/播放
 STOP              no-osd stop ; show-text "已停止"                              # 停止
 REWIND            seek -30 ; script-message-to uosc flash-elements timeline   # 向前跳转30秒，刷新uosc进度条
 FORWARD           seek  30 ; script-message-to uosc flash-elements timeline   # 向后跳转30秒，刷新uosc进度条
 PREV              script-binding uosc/prev                              # uosc跳转上一个文件
 NEXT              script-binding uosc/next                              # uosc跳转下一个文件

 MBTN_BACK         script-binding uosc/prev
 MBTN_FORWARD      script-binding uosc/next
 MBTN_MID          script-binding uosc/playlist-cursor                   # 在鼠标位置打开播放列表
 MBTN_LEFT         script-message-to input_plus mouse-single-click       # 单击视频区域：播放 / 暂停
 MBTN_LEFT_DBL     script-message-to input_plus mouse-double-click       # 双击视频区域：全屏/窗口
 MBTN_RIGHT        script-binding uosc/menu-cursor                       # 打开uosc菜单
 Ctrl+MBTN_RIGHT   context-menu                                          # 打开原生菜单
 MBTN_RIGHT_DBL    ignore

#WHEEL_DOWN        no-osd add volume -1 ; script-message-to uosc flash-elements volume   # 音量降低，刷新uosc音量条
#WHEEL_UP          no-osd add volume  1 ; script-message-to uosc flash-elements volume   # 音量升高，刷新uosc音量条

 ESC               no-osd set fullscreen no ; show-text "退出全屏"                  # 窗口
 ENTER             no-osd cycle fullscreen ; show-text "已切换全屏/窗口"              # 全屏/窗口
 KP_ENTER          no-osd cycle fullscreen ; show-text "已切换全屏/窗口"              # 右侧 Enter：全屏/窗口
 Alt+ENTER         no-osd cycle fullscreen ; show-text "已切换全屏/窗口"
 Alt+1             script-message-to input_plus window-scale-pct 35       # 窗口大小为显示器面积 35%
 Alt+2             script-message-to input_plus window-scale-pct 45       # 窗口大小为显示器面积 45%
 Alt+3             script-message-to input_plus window-scale-pct 60       # 窗口大小为显示器面积 60%
 Alt+4             script-message-to input_plus window-scale-pct 85       # 窗口大小为显示器面积 85%
 Ctrl+WHEEL_DOWN   no-osd add current-window-scale -0.05 ; show-text "窗口缩小 5%"   # 缩小窗口 5%
 Ctrl+WHEEL_UP     no-osd add current-window-scale  0.05 ; show-text "窗口放大 5%"   # 放大窗口 5%
 SPACE             no-osd cycle pause
 UP                no-osd add volume  1 ; show-text "音量 ${volume}" ; script-message-to uosc flash-elements volume          # 音量提高 1
 DOWN              no-osd add volume -1 ; show-text "音量 ${volume}" ; script-message-to uosc flash-elements volume          # 音量降低 1
 LEFT              seek -2 relative+exact ; script-message-to uosc flash-elements timeline              # 后退 2 秒
 RIGHT             seek  2 relative+exact ; script-message-to uosc flash-elements timeline               # 前进 2 秒
 Ctrl+UP           no-osd add sub-scale  0.1 ; show-text "字幕字号 +10%"       # 字幕字号 +10%
 Ctrl+DOWN         no-osd add sub-scale -0.1 ; show-text "字幕字号 -10%"       # 字幕字号 -10%
 Shift+UP          script-binding bilibili_danmaku/font-scale-up         # 弹幕字号 +10%
 Shift+DOWN        script-binding bilibili_danmaku/font-scale-down       # 弹幕字号 -10%
 Alt+MBTN_LEFT     script-binding positioning/drag-to-pan                 # 移动画面
 BS                no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "重置 --video-zoom --panscan --video-pan --video-align"
 Alt+WHEEL_DOWN    script-binding positioning/cursor-centric-zoom -0.1    # 缩小画面
 Alt+WHEEL_UP      script-binding positioning/cursor-centric-zoom  0.1    # 放大画面
