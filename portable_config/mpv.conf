### 行首如果存在注释符号 "#" 则说明该项 “未启用”
### 文档_ https://github.com/hooke007/mpv_PlayKit/blob/main/portable_config/mpv.conf
### 注意：当前预设下，选项 --volume --glsl-shaders 的关联属性已被全局追踪记录，移除缓存文件 saved-props.json 才能使其的更改生效
##两个井号为tare添加注释

 input-conf = "~~/input_uosc.conf"  ## 按键绑定配置文件
 include = "~~/profiles.conf"  ## 包含个人配置文件
 include = "~~/script-opts.conf"  ## 包含脚本选项配置文件
 use-filedir-conf = yes  ## 允许加载与媒体同名的 .conf 文件
#log-file = "~~desktop/mpv-lazy.log"

 ########
 # 基础 #
 ########

 vo = gpu-next  ## 视频输出驱动（GPU 渲染）
#gpu-context = winvk
#d3d11-exclusive-fs = yes
#d3d11-flip = no

 hwdec = auto-copy  ## 硬件解码（自动，回拷模式）
 hwdec-codecs = h264,hevc,vp8,vp9,av1,ffv1  ## 硬件解码的编解码器列表

#d3d11-adapter = "NVIDIA GeForce RTX 2070 Super"
#vulkan-device = "NVIDIA GeForce RTX 2070 Super"


 ########
 # 功能 #
 ########

 idle = yes  ## 空闲时保持窗口打开
 input-ime = no  ## 禁用输入法
 input-ar-delay = 400  ## 按键自动重复延迟
input-ipc-server = mpvpipe  ## IPC 管道（供外部程序控制）
 input-builtin-bindings = no  ## 禁用 mpv 内置按键绑定
#pause = yes

 hr-seek-framedrop = no  ## 快速拖动时允许丢帧
 save-position-on-quit = yes  ## 退出时保存播放进度
 watch-later-options = start,vid,aid,sid  ## 保存的播放属性（进度/轨道）

 target-colorspace-hint = no  ## 禁用目标色彩空间提示
#target-colorspace-hint-mode = source
#target-colorspace-hint-strict = no

 autocreate-playlist = same  ## 自动创建同目录播放列表
 directory-mode = ignore  ## 忽略目录项
#directory-filter-types = video,audio
#video-exts = avi,flv,m2ts,mkv,mov,mp4,ts,wmv
#image-exts = avif,bmp,jpeg,jpg,jxl,png,webp
#audio-exts = aiff,ape,flac,mp3,ogg,opus,wav

 keep-open = yes  ## 播放结束后保持打开
#ontop = yes
 border = no  ## 无边框窗口
 title-bar = no  ## 隐藏标题栏
 # 关闭 mpv 原生窗口边缘吸附；无边框窗口拖到屏幕外后，松开时保持当前位置。
 snap-window = no
 geometry = 1305x734  ## 窗口初始尺寸
 keepaspect-window = yes  ## 保持窗口宽高比
#auto-window-resize = no
 hidpi-window-scale = no  ## 禁用 HiDPI 窗口缩放

 demuxer-max-bytes = 1024MiB  ## 解码缓存上限
 demuxer-max-back-bytes = 512MiB  ## 反向缓存上限
 demuxer-seekable-cache = yes  ## 启用可拖动缓存
#icc-cache = no
 icc-cache-dir = "~~/_cache/icc"  ## ICC 配置缓存目录
#gpu-shader-cache = no
 gpu-shader-cache-dir = "~~/_cache/shader"  ## 着色器缓存目录
 watch-later-dir = "~~/_cache/watch_later"  ## 播放进度缓存目录


 #######
 # OSD #
 #######

 osd-on-seek = msg  ## 拖动进度时显示 OSD 信息
#osd-blur = 1
 osd-bar = no  ## 禁用 OSD 进度条
 osd-bar-w = 100  ## OSD 进度条宽度
 osd-bar-h = 1.8  ## OSD 进度条高度
 osd-bar-align-y = -1  ## OSD 进度条垂直对齐
 osd-color = "#672168"  ## OSD 文字颜色
 osd-outline-color = "#EEEEEE"  ## OSD 描边颜色
 osd-outline-size = 0.8  ## OSD 描边宽度
 osd-font-size = 34  ## OSD 字体大小
 osd-fractions = yes  ## OSD 显示时间分数
 osd-playing-msg = "${filename}"  ## 播放时显示的 OSD 消息
 osd-duration = 2000  ## OSD 消息显示时长
 osd-playing-msg-duration = 3000  ## 播放消息显示时长


 ########
 # 音频 #
 ########

 ao = wasapi  ## 音频输出驱动（WASAPI）
#audio-device = "wasapi/{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}"
#audio-exclusive = yes

 volume = 100   # 注意：此参数当前在 script-opts.conf 文件中存在关联处理（参见 “保存全局属性并恢复” 部分）
 volume-max = 130  ## 最大音量
 audio-channels = stereo  ## 输出声道数
#alang = chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze
 audio-file-auto = fuzzy  ## 自动加载同名音频


 ########
 # 视频 #
 ########

#icc-profile-auto = yes

#target-prim = display-p3
#target-trc = gamma2.2

 video-sync = display-resample  ## 视频同步（重采样匹配刷新率）
#video-sync-max-video-change = 5
 interpolation = yes  ## 插帧平滑视频
#tscale = sphinx

 cscale = bilinear  ## 色度缩放算法
 scale = bilinear  ## 视频缩放算法
 dscale = bicubic  ## 视频缩小算法
 sigmoid-upscaling = no  ## 禁用 Sigmoid 放大
 correct-downscaling = no  ## 禁用正确缩小

 dither-depth = no  ## 禁用抖动
#deband = yes
 deinterlace = auto  ## 自动去隔行

 background-tile-color-0 = "#B4B4B4"  ## 背景色块颜色 0
 background-tile-color-1 = "#DCDCDC"  ## 背景色块颜色 1
 background-tile-size = 128  ## 背景色块大小


 ####################
 # 脚本 滤镜 着色器 #
 ####################

#load-stats-overlay = no
 osc = no  ## 禁用内置 OSC（使用 uosc）
# Bilibili / YouTube 优先通过 Chrome Cookie Bridge 注入内存 Cookie；Chrome 不可用时回退到桥接器导出的 Cookie txt。
# ytdl_path 是内置 ytdl_hook 的脚本选项（不是 mpv 核心 ytdl-path 选项）。
 ytdl-raw-options=proxy=http://127.0.0.1:10809  ## yt-dlp 代理地址（Clash）
 ytdl-raw-options-append = yes-playlist=  ## 下载完整播放列表
 ytdl-raw-options-append = write-subs=  ## 下载外挂字幕
 ytdl-raw-options-append = write-auto-subs=  ## 下载自动字幕
# 仅下载中文优先与英文回退字幕；Bilibili 的 danmaku XML 由 A 键单独转换。
 ytdl-raw-options-append = sub-langs=zh.*,en.*

#load-scripts = no

#border-background = blur
 background-blur-radius = 8  ## 背景模糊半径

 glsl-shaders-append = "~~/shaders/QCOM/QCOM_SGEDS_ms_RT.glsl"  ## 加载着色器（QCOM）
#glsl-shader-opts-append = QCOM_SGEDS_ms_RT/STR=2.0


 ########
 # 字幕 #
 ########

 sub-auto = fuzzy  ## 字幕自动加载模式
 sub-file-paths = sub;Subs;subtitles  ## 字幕搜索路径
 sub-codepage = GB18030  ## 字幕编码
 slang = chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze  ## 首选字幕语言
 subs-fallback = yes  ## 允许回退到其他语言字幕

 #blend-subtitles = yes
 #sub-hdr-peak = 100
# ========== 2. HDR亮度修正（兼容SDR/HDR） ==========
# 设为 1000 可兼顾大多数HDR屏幕，SDR下mpv会自动映射，不会过曝
#sub-hdr-peak = 500
# 图形字幕与文本字幕统一，避免极端值
#image-subs-hdr-peak = 500


 sub-font = "LXGW WenKai Mono Lite"  ## 字幕字体
 sub-font-size = 44  ## 字幕字号
#sub-scale-with-window = no
 sub-scale-signs = yes  ## 按窗口缩放 ASS 图形
 sub-outline-size = 2   #外框描边
 sub-blur = 1  ## 字幕模糊
 sub-color = "#BFA8DC"
 sub-outline-color = "#572172"
#sub-back-color = "#801C1C1C"   # 背景框半透明深灰底，透明度50%（80）00（全透明）到 FF（完全不透明）
sub-shadow-offset = 1  # 阴影 轻微阴影增加立体感
 sub-use-margins = yes  ## 字幕使用屏幕边距

#sub-ass-use-video-data = aspect-ratio
#sub-ass-video-aspect-override  = 16:9

#sub-ass-override = force
#sub-ass-scale-with-window = yes
 sub-ass-force-margins = yes  ## 强制 ASS 字幕使用边距
#sub-ass-style-overrides = Fontname=LXGW WenKai Mono Lite

 image-subs-hdr-peak = 10000
#stretch-image-subs-to-screen = yes
#image-subs-video-resolution = yes


 ########
 # 截图 #
 ########

 screenshot-format = png  ## 截图格式

 screenshot-jpeg-quality = 100  ## JPEG 截图质量
#screenshot-jpeg-source-chroma = no
 screenshot-png-compression = 4  ## PNG 压缩等级
 screenshot-webp-lossless = yes  ## WebP 无损保存
#screenshot-webp-quality = 100
#screenshot-webp-compression = 0
 screenshot-jxl-distance = 0  ## JXL 压缩距离（0 无损）

 screenshot-tag-colorspace = no  ## 截图不写入色彩空间信息
 screenshot-high-bit-depth = no  ## 禁用高位深截图
 screenshot-template = "~~desktop/MPV-%P-N%n"  ## 截图保存路径模板

##clash代理端口 cookies
#proxy=http://127.0.0.1:10809
