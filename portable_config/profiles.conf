### 文档_ https://github.com/hooke007/mpv_PlayKit/blob/main/portable_config/profiles.conf

 ##############
 # 配置预设组 #
 ##############

[speed_limit1]
 profile-desc = 速度变化下限的控制
 profile-cond = p.speed<0.1
 speed = 0.1


[speed_limit2]
 profile-desc = 速度变化上限的控制
 profile-cond = p.speed>8
 speed = 8


[ontop_playback]
 profile-desc = 基于播放状态的自动置顶
#profile-cond = not pause and not p.idle_active   # 未自动启用
 profile-restore = copy
 ontop = yes


## https://github.com/mpv-player/mpv/issues/11122
[vsync_auto]
 profile-desc = 基于帧率或垂直同步率或速率的自动视频同步
 # 144 Hz / 24-30 FPS 仍应保持 display-resample；按刷新率倍率判断会把
 # OSD/弹幕的最终呈现错误地压回视频帧率。仅对真正的超高刷显示器回退。
 profile-cond = (p.container_fps and p.container_fps>32) or (p.display_fps and p.display_fps>180) or p.speed~=1
 profile-restore = copy
 interpolation = no
 video-sync = audio


[deband_bitrate]
 profile-desc = 基于码率的自动去色带
 profile-cond = ((p.file_size/1024)*8)/p.duration<=3000
 profile-restore = copy
 deband = yes


[save_props_auto]
 profile-desc = 基于进度或时长或视频轨类型的自动保存属性
 profile-cond = p.percent_pos>=90 or p.duration<=300 or not vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]
 profile-restore = copy
 save-position-on-quit = no


[HDR_generic]
 profile-desc = hdr通用
 profile-cond = p["video-params/sig-peak"]>1
 profile-restore = copy
 blend-subtitles = no
#tone-mapping = hable
#gamut-mapping-mode = clip
 hdr-reference-white = 100
 hdr-peak-percentile = 99.99
#target-peak = 100
#sub-color = 0.7
#sub-border-color = 0.1
#sub-back-color = "#00000000"
#sub-shadow-offset = 0


[stop_at_end]
 profile-desc = 循环全关时播完停在当前文件
 profile-cond = not p["loop-playlist"] and not p["loop-file"]
 profile-restore = copy
 keep-open = always
