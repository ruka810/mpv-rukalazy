### 文档_ https://github.com/hooke007/mpv_PlayKit/blob/main/portable_config/input_uosc.conf


#                  script-binding uosc/open-file                         #! 加载 > ※ 文件浏览器
 Ctrl+v            script-message-to bilibili_playlist suppress-expand; update-clipboard text; loadfile ${clipboard/text} replace     #! 加载 > 剪贴板URL(仅当前视频)
 Ctrl+Shift+v      script-message-to bilibili_playlist allow-expand; update-clipboard text; loadfile ${clipboard/text} replace     #! 加载 > 剪贴板URL(合集全部)
#                  script-binding uosc/load-subtitles                    #! 加载 > ※ 导入 字幕轨

 v                 script-binding uosc/playlist                          #! 导航 > ※ 播放列表
#                  script-binding uosc/editions                          #! 导航 > ※ 版本列表
#                  script-binding uosc/chapters                          #! 导航 > ※ 章节列表
#                  script-binding uosc/video                             #! 导航 > ※ 视频轨列表
#                  script-binding uosc/audio                             #! 导航 > ※ 音频轨列表
#                  script-binding uosc/subtitles                         #! 导航 > ※ 字幕轨列表
#                  playlist-shuffle                                      #! 导航 > 播放列表乱序重排

 f                 no-osd cycle fullscreen ; show-text "全屏/窗口切换"        #! 播放 > 全屏/窗口
 b                 script-binding uosc/send-live-danmaku                 #! 播放 > 发送 Bilibili 直播弹幕
 d                 script-binding bilibili_danmaku/toggle                #! 播放 > 开关 Bilibili 视频/直播弹幕
 q                 script-binding bilibili_ai_subtitle/toggle                #! 播放 > 开关实时字幕（B站AI字幕优先 / Whisper）
 w                 script-binding bilibili_ai_subtitle/translate             #! 播放 > 开关实时翻译（AI字幕模式亦生效）
 Ctrl+d            script-binding bilibili_danmaku/menu                  #! 播放 > Bilibili 弹幕设置
 a                 script-binding input_plus/frame_back_step_osd          #! 播放 > 上一帧
 s                 script-binding input_plus/frame_step_osd               #! 播放 > 下一帧
[                 script-binding live_playlist/favorite-prev            #! 播放 > 播放上一个文件/收藏
]                 script-binding live_playlist/favorite-next            #! 播放 > 播放下一个文件/收藏
 l                 ab-loop                                               #! 播放 > 设置/清除 AB循环点
 {                 ignore                                                    #! 播放 > 无功能
 }                 ignore                                                    #! 播放 > 无功能
 -                 no-osd cycle-values speed 1 1.2 1.5 2 ; script-message-to uosc flash-elements speed   #! 播放 > 依次提高速度
 =                 ignore                                                    #! 播放 > 无功能
#                  ignore                                                #! 播放 > ---
 n                 no-osd add audio-delay -0.1 ; show-text "音频提前100ms │ 当前${audio-delay} "                                  #! 播放 > 音频提前 100ms
 m                 no-osd add audio-delay  0.1 ; show-text "音频延后100ms │ 当前${audio-delay} "                                  #! 播放 > 音频延后 100ms
 ,                 no-osd add sub-delay -0.1 ; show-text "字幕提前100ms │ 当前${sub-delay} "                                    #! 播放 > 字幕提前 100ms
 .                 no-osd add sub-delay  0.1 ; show-text "字幕延后100ms │ 当前${sub-delay} "                                    #! 播放 > 字幕延后 100ms
#                  ignore                                                #! 播放 > ---
 x                 no-osd add speed -0.1 ; show-text "Speed ${speed}x" ; script-message-to uosc flash-elements speed          #! 播放 > 速度减 0.1x
 c                 no-osd add speed  0.1 ; show-text "Speed ${speed}x" ; script-message-to uosc flash-elements speed          #! 播放 > 速度加 0.1x
z                 script-binding input_plus/speed_recover ; script-message-to uosc flash-elements speed  #! 播放 > 切换/复位速度
 /                 no-osd set audio-delay 0 ; no-osd set sub-delay 0 ; show-text "已重置音视频同步"                   #! 播放 > 重置音频与字幕同步
 Shift+BS          ignore                                                 #! 播放 > 无功能
 Shift+SPACE       ignore                                                 #! 播放 > 无功能
 F5                script-binding live_refresh/sync                     #! 播放 > 同步当前直播进度
 Ctrl+F5           script-binding live_refresh/refresh                  #! 播放 > 刷新当前媒体

#                  ignore                                                #! ---
 ~                 vf clr ""                                             #! VF 滤镜 > 清空
#                                                                        #! VF 滤镜 > ---
 !                 vf set vapoursynth="~~/vs/MEMC_MVT_LQ.vpy"            #! VF 滤镜 > 预设 补帧 MVTools_快速
 @                 vf set vapoursynth="~~/vs/MEMC_RIFE_DML.vpy"          #! VF 滤镜 > 预设 补帧 RIFE_DX12
 SHARP             vf set vapoursynth="~~/vs/MEMC_DRBA_DML.vpy"          #! VF 滤镜 > 预设 补帧 DRBA_DX12
 $                 vf set vapoursynth="~~/vs/MEMC_RIFE_NV.vpy"           #! VF 滤镜 > 预设 补帧 RIFE_RTX (DLC-vsNV)
 %                 vf set vapoursynth="~~/vs/MEMC_DRBA_NV.vpy"           #! VF 滤镜 > 预设 补帧 DRBA_RTX (DLC-vsNV)
#                  ignore                                                #! VF 滤镜 > ---
 ^                 vf set vapoursynth="~~/vs/MIX_UAI_DML.vpy"            #! VF 滤镜 > 预设 自定义AI UAI_DX12
 &                 vf set vapoursynth="~~/vs/MIX_UAI_NV_TRT.vpy"         #! VF 滤镜 > 预设 自定义AI UAI_RTX (DLC-vsNV)

 Ctrl+`            change-list glsl-shaders clr ""                       #! 着色器 > 清空
#                  ignore                                                #! 着色器 > ---
 Ctrl+1            change-list glsl-shaders toggle "~~/shaders/Ani/Ani4Kv2_ArtCNN_C4F32_i2_dx.glsl"   #! 着色器 > 开关 LUMA: Ani4Kv2
 Ctrl+2            change-list glsl-shaders toggle "~~/shaders/Ani/AniSD_ArtCNN_C4F32_i4_dx.glsl"     #! 着色器 > 开关 LUMA: AniSD
 Ctrl+3            change-list glsl-shaders toggle "~~/shaders/FSRCNNX/FSRCNNX_x2_16_0_4_1.glsl"      #! 着色器 > 开关 LUMA: FSRCNNX
 Ctrl+4            change-list glsl-shaders toggle "~~/shaders/EDI/nnedi3_nns64_win8x4.glsl"          #! 着色器 > 开关 LUMA: NNEDI3
#                  ignore                                                #! 着色器 > ---
 Ctrl+5            change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Restore_CNN_L.glsl"      #! 着色器 > 开关 MAIN: A4K_重建
 Ctrl+6            change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Upscale_GAN_x2_M.glsl"   #! 着色器 > 开关 MAIN: A4K_放大
 Ctrl+7            change-list glsl-shaders toggle "~~/shaders/ESRGAN/k7_modernAnime_FHD_x2.glsl"       #! 着色器 > 开关 MAIN: k7 Anime
 Ctrl+8            change-list glsl-shaders toggle "~~/shaders/ESRGAN/k7_modernAnime_DT_FHD_x2.glsl"    #! 着色器 > 开关 MAIN: k7 Anime_DT
#                  ignore                                                #! 着色器 > ---
 Ctrl+9            change-list glsl-shaders toggle "~~/shaders/QCOM/QCOM_SGEDS_ms_RT.glsl"            #! 着色器 > 开关 POSTKERNEL: QCOM_主缩放锐化 RT (*)
#                  ignore                                                #! 着色器 > ---
 Ctrl+0            change-list glsl-shaders toggle "~~/shaders/Adaptive_sharpen/Adaptive_sharpen_lite_RT.glsl"   #! 着色器 > 开关 SCALED: 自适应锐化lite RT

#                  ignore                                                #! ---
 Ctrl+s            script-binding capture_tools/capture-screenshot-original #! 截屏 > 选择位置/格式保存原始画面
Ctrl+S            script-binding capture_tools/capture-screenshot-rendered #! 截屏 > 渲染截图（带当前vf滤镜/着色器，源分辨率）
 Ctrl+Shift+i      script-binding capture_tools/capture-start-clip-rendered  #! 截取 > 设置渲染导出起点
 Ctrl+Shift+o      script-binding capture_tools/capture-finish-clip-rendered #! 截取 > 选择格式并带vf/着色器导出片段
 I                 script-binding capture_tools/capture-start-clip        #! 截取 > 设置截取起点
 O                 script-binding capture_tools/capture-finish-clip       #! 截取 > 选择格式并导出片段

#                  cycle-values hwdec "auto" "auto-copy" "no"            #! 视频 > 切换 解码模式
#                  cycle deband                                          #! 视频 > 切换 去色带状态
#                  cycle deinterlace                                     #! 视频 > 切换 去隔行状态
#                  cycle icc-profile-auto                                #! 视频 > 切换 自动校色
#                  cycle correct-pts                                     #! 视频 > 切换 时间码解析模式
 1                 no-osd add contrast -1 ; show-text "对比度 -1"                              #! 视频 > 均衡器 > 对比度 -
 2                 no-osd add contrast  1 ; show-text "对比度 +1"                              #! 视频 > 均衡器 > 对比度 +
 3                 no-osd add brightness -1 ; show-text "亮度 -1"                              #! 视频 > 均衡器 > 亮度/明度 -
 4                 no-osd add brightness  1 ; show-text "亮度 +1"                              #! 视频 > 均衡器 > 亮度/明度 +
 5                 no-osd add gamma -1 ; show-text "伽马 -1"                                  #! 视频 > 均衡器 > 伽马 -
 6                 no-osd add gamma  1 ; show-text "伽马 +1"                                  #! 视频 > 均衡器 > 伽马 +
 7                 no-osd add saturation -1 ; show-text "饱和度 -1"                            #! 视频 > 均衡器 > 饱和度/纯度 -
 8                 no-osd add saturation  1 ; show-text "饱和度 +1"                            #! 视频 > 均衡器 > 饱和度/纯度 +
 9                 no-osd add hue -1 ; show-text "色相 -1"                                    #! 视频 > 均衡器 > 色相 -
 0                 no-osd add hue  1 ; show-text "色相 +1"                                    #! 视频 > 均衡器 > 色相 +
#                  ignore                                                #! 视频 > 均衡器 > ---
 Ctrl+BS           no-osd set contrast 0 ; no-osd set brightness 0 ; no-osd set gamma 0 ; no-osd set saturation 0 ; no-osd set hue 0 ; show-text "已重置对比度/亮度/伽马/饱和度/色相" #! 视频 > 均衡器 > 重置 全部

 Ctrl+i            script-binding uosc/keybinds                          #! 工具 > ※ 按键绑定列表
 TAB               script-binding display-stats-toggle                   #! 工具 > 常驻显示统计信息
 `                 script-binding commands/open                          #! 工具 > 显示OSD命令行（控制台）
 Ctrl+r            script-message-to save_global_props clean_data        #! 工具 > 清除已记录的属性值
#                  cycle border                                          #! 工具 > 切换 窗口边框
#                  cycle ontop                                           #! 工具 > 切换 窗口置顶
#                  script-binding input_plus/input_test_toggle           #! 工具 > 按键名检测
 g                 ignore
 g-m               script-binding select/menu                            #! 工具 > 打开select总菜单
 g-p               script-binding select/show-properties                 #! 工具 > 打开select分菜单-属性列表
#                  script-binding uosc/audio-device                      #! 工具 > ※ 音频输出设备列表
#                  script-binding uosc/stream-quality                    #! 工具 > ※ 流式传输品质
#                  script-binding uosc/show-in-directory                 #! 工具 > ※ 打开 当前文件所在路径
#                  script-binding uosc/open-config-directory             #! 工具 > ※ 打开 设置目录

